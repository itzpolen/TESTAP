<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fc">
  <title>Payment return | AquaDirect</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17243a;
      background: #f4f8fc;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }
    main {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid #e3eaf3;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(23, 52, 95, .08);
    }
    .brand { color: #087cf0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .icon {
      display: grid;
      width: 54px;
      height: 54px;
      margin-top: 26px;
      place-items: center;
      border-radius: 17px;
      color: #087cf0;
      background: #eaf3ff;
      font-size: 27px;
      font-weight: 800;
    }
    .icon.cancel { color: #c43232; background: #fff0ef; }
    h1 { margin: 18px 0 8px; font-size: clamp(24px, 6vw, 30px); letter-spacing: -.04em; }
    p { color: #59677b; font-size: 15px; line-height: 1.65; }
    .notice { margin-top: 22px; padding: 13px 15px; border-radius: 12px; background: #f4f8fc; font-size: 13px; }
    .notice strong { color: #17243a; }
    .return-link {
      display: inline-flex;
      min-height: 48px;
      margin-top: 16px;
      padding: 0 20px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: #fff;
      background: #087cf0;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .return-link:focus-visible { outline: 3px solid #17243a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">AquaDirect</div>
    <div class="icon" id="icon" aria-hidden="true">✓</div>
    <h1 id="title">Payment status</h1>
    <p id="message">Return to the AquaDirect app to check your order.</p>
    <div class="notice">
      <strong>This page does not confirm payment.</strong>
      PayMongo’s payment notification updates your order status in the app and may take a few moments.
    </div>
    <a class="return-link" id="return-link" href="aquadirect://payment-return/home">Return to AquaDirect</a>
  </main>
  <script>
    const status = new URLSearchParams(window.location.search).get("status");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const icon = document.getElementById("icon");
    const returnLink = document.getElementById("return-link");
    const orderId = new URLSearchParams(window.location.search).get("order_id");

    if (orderId) {
      const appUrl = new URL(returnLink.href);
      appUrl.searchParams.set("order_id", orderId);
      returnLink.href = appUrl.toString();
    }

    if (status === "success") {
      title.textContent = "Payment submitted";
      message.textContent = "Return to AquaDirect. The app will check your payment status.";
    } else if (status === "failed") {
      title.textContent = "Payment failed";
      message.textContent = "PayMongo did not confirm this payment. Return to AquaDirect to check your order or try again.";
      icon.textContent = "!";
      icon.classList.add("cancel");
    } else if (status === "cancel") {
      title.textContent = "Checkout cancelled";
      message.textContent = "No payment confirmation was received. Return to AquaDirect if you want to try again.";
      icon.textContent = "!";
      icon.classList.add("cancel");
    } else {
      title.textContent = "Payment status unavailable";
      message.textContent = "Return to AquaDirect to check your order status.";
      icon.textContent = "?";
      icon.classList.add("cancel");
    }
  </script>
</body>
</html>
